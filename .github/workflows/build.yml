name: build-and-package

on:
  push:
    branches: [main]

concurrency:
  group: build-and-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @cod/web

  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Package desktop
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then npm run package:win; fi
          if [[ "${{ runner.os }}" == "macOS" ]]; then npm run package:mac; fi
          if [[ "${{ runner.os }}" == "Linux" ]]; then npm run package:linux; fi
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --verify --deep --strict --verbose=2 apps/desktop/release/mac-arm64/cod.app
          hdiutil verify apps/desktop/release/COD-*-mac-arm64.dmg

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run package:android

  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run package:ios
