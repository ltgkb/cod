name: build-and-package

on:
  push:
    branches: [main]
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/check-npm-audit.test.mjs
      - run: node scripts/check-npm-audit.mjs

  web:
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @cod/web

  desktop:
    needs: security
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package desktop
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then npm run package:win; fi
          if [[ "${{ runner.os }}" == "macOS" ]]; then npm run package:mac; fi
          if [[ "${{ runner.os }}" == "Linux" ]]; then npm run package:linux; fi
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --verify --deep --strict --verbose=2 apps/desktop/release/mac-arm64/cod.app
          hdiutil verify apps/desktop/release/COD-*-mac-arm64.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: cod-desktop-${{ runner.os }}
          path: apps/desktop/release/*
          if-no-files-found: error

  android:
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run doctor -w @cod/mobile
      - run: npm run export:android
      - uses: actions/upload-artifact@v7
        with:
          name: cod-android-expo-bundle
          path: apps/mobile/release/android
          if-no-files-found: error

  ios:
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run export:ios
      - uses: actions/upload-artifact@v7
        with:
          name: cod-ios-expo-bundle
          path: apps/mobile/release/ios
          if-no-files-found: error
