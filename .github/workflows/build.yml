name: build-and-package

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-and-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @cod/web

  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Package desktop
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then npm run package:win; fi
          if [[ "${{ runner.os }}" == "macOS" ]]; then npm run package:mac; fi
          if [[ "${{ runner.os }}" == "Linux" ]]; then npm run package:linux; fi
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --verify --deep --strict --verbose=2 apps/desktop/release/mac-arm64/cod.app
          hdiutil verify apps/desktop/release/COD-*-mac-arm64.dmg
      - name: Upload desktop installers
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: cod-desktop-${{ runner.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
            apps/desktop/release/*.dmg
            apps/desktop/release/*.dmg.blockmap
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run package:android
      - name: Upload Android APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: cod-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run package:ios
      - run: ditto -c -k --sequesterRsrc --keepParent apps/mobile/release/ios-simulator/Build/Products/Release-iphonesimulator/App.app apps/mobile/release/COD-ios-simulator.zip
      - name: Upload iOS simulator package
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: cod-ios-simulator
          path: apps/mobile/release/COD-ios-simulator.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
