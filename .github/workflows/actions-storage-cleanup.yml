name: Actions storage cleanup

on:
  pull_request:
    paths:
      - .github/workflows/actions-storage-cleanup.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show workflows responsible for artifacts and caches
        shell: bash
        run: |
          set -euo pipefail
          echo "Workflow files:"
          find .github/workflows -maxdepth 1 -type f -print | sort
          echo
          echo "Matching heavy-build workflow definitions:"
          while IFS= read -r file; do
            echo "===== ${file} ====="
            sed -n '1,320p' "${file}"
          done < <(grep -RIlE 'build-and-package|upload-artifact|cache:[[:space:]]*(npm|yarn|pnpm)' .github/workflows || true)

      - name: Cancel other queued or running workflows on this branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          cancel_other_runs() {
            local state id
            for state in queued in_progress; do
              while IFS= read -r id; do
                [[ -z "${id}" || "${id}" == "${CURRENT_RUN_ID}" ]] && continue
                echo "Cancelling ${state} run ${id} on ${BRANCH}"
                gh api -X POST "repos/${REPO}/actions/runs/${id}/cancel" >/dev/null 2>&1 || true
              done < <(gh api --paginate "repos/${REPO}/actions/runs?branch=${BRANCH}&status=${state}&per_page=100" --jq '.workflow_runs[].id')
            done
          }

          for pass in 1 2 3; do
            echo "Cancellation pass ${pass}"
            cancel_other_runs
            sleep 15
          done

      - name: Delete repository Actions artifacts and caches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          delete_storage() {
            local id size name
            local artifact_count=0 artifact_bytes=0
            local cache_count=0 cache_bytes=0

            while IFS=$'\t' read -r id size name; do
              [[ -z "${id}" ]] && continue
              echo "Deleting artifact ${name} (${size} bytes, id ${id})"
              if gh api -X DELETE "repos/${REPO}/actions/artifacts/${id}" >/dev/null 2>&1; then
                artifact_count=$((artifact_count + 1))
                artifact_bytes=$((artifact_bytes + size))
              fi
            done < <(gh api --paginate "repos/${REPO}/actions/artifacts?per_page=100" --jq '.artifacts[] | [.id, .size_in_bytes, .name] | @tsv')

            while IFS=$'\t' read -r id size name; do
              [[ -z "${id}" ]] && continue
              echo "Deleting cache ${name} (${size} bytes, id ${id})"
              if gh api -X DELETE "repos/${REPO}/actions/caches/${id}" >/dev/null 2>&1; then
                cache_count=$((cache_count + 1))
                cache_bytes=$((cache_bytes + size))
              fi
            done < <(gh api --paginate "repos/${REPO}/actions/caches?per_page=100" --jq '.actions_caches[] | [.id, .size_in_bytes, .key] | @tsv')

            echo "Deleted ${artifact_count} artifacts totaling ${artifact_bytes} bytes"
            echo "Deleted ${cache_count} caches totaling ${cache_bytes} bytes"
          }

          delete_storage
          sleep 20
          delete_storage

          echo "Remaining artifacts: $(gh api "repos/${REPO}/actions/artifacts?per_page=1" --jq '.total_count')"
          echo "Remaining caches: $(gh api "repos/${REPO}/actions/caches?per_page=1" --jq '.total_count')"
