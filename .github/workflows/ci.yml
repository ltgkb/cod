name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/check-npm-audit.test.mjs
      - run: node scripts/check-npm-audit.mjs
      - run: npm run lint
      - run: npm test
      - run: npm run build
