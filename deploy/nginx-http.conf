server_tokens off;

# HTTPS traffic reaches this host through the COD AWS ALB subnet. Trust only
# that proxy subnet so a direct Internet client cannot spoof X-Forwarded-For.
# Keep this CIDR aligned with the load balancer subnet during infrastructure
# changes; never widen it to the whole RFC1918 range or 0.0.0.0/0.
set_real_ip_from 172.31.0.0/20;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Preserve a caller-supplied correlation ID when present. The control plane
# validates its character set and length before using it; otherwise it creates
# a fresh ID. Chat retries also bind it to the account and request fingerprint
# through a persistent claim before any upstream model call or settlement.
map $http_x_request_id $cod_request_id {
    default $http_x_request_id;
    "" $request_id;
}

limit_req_zone $binary_remote_addr zone=cod_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=cod_ai:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=cod_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=cod_heartbeat:10m rate=2r/s;
limit_req_status 429;
