server_tokens off;

# HTTPS traffic reaches this host through the COD AWS ALB subnets. Trust only
# the three observed load-balancer subnets so a direct Internet client cannot
# spoof X-Forwarded-For. Keep these CIDRs aligned with the ALB during
# infrastructure changes; never widen them to the VPC or 0.0.0.0/0.
set_real_ip_from 172.31.0.0/20;
set_real_ip_from 172.31.16.0/20;
set_real_ip_from 172.31.32.0/20;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Keep the origin usable by the ALB and localhost diagnostics, while forcing
# direct Internet traffic back through the public HTTPS edge. Unlike request
# headers, $realip_remote_addr retains the actual TCP peer after real-ip
# processing, so an origin client cannot opt itself into this allowlist.
geo $realip_remote_addr $cod_trusted_origin_peer {
    default 0;
    127.0.0.1 1;
    ::1 1;
    172.31.0.0/20 1;
    172.31.16.0/20 1;
    172.31.32.0/20 1;
}

# Preserve a caller-supplied correlation ID when present. The control plane
# validates its character set and length before using it; otherwise it creates
# a fresh ID. Chat retries also bind it to the account and request fingerprint
# through a persistent claim before any upstream model call or settlement.
map $http_x_request_id $cod_request_id {
    default $http_x_request_id;
    "" $request_id;
}

limit_req_zone $binary_remote_addr zone=cod_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=cod_ai:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=cod_auth:10m rate=10r/m;
# Keep a broad per-IP ceiling for forged device IDs, then a per-device budget
# so legitimate users behind one office/VPN NAT do not consume each other's
# lease renewals.
limit_req_zone $binary_remote_addr zone=cod_heartbeat_ip:10m rate=50r/s;
limit_req_zone $binary_remote_addr$uri zone=cod_heartbeat_device:10m rate=2r/s;
limit_req_status 429;
