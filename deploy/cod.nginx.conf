server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 95.41.23.60 _;

    proxy_hide_header X-Content-Type-Options;
    add_header X-Content-Type-Options nosniff always;

    location = /control-health {
        if ($cod_trusted_origin_peer = 0) { return 404; }
        proxy_pass http://127.0.0.1:8787/health;
    }

    location = /control-ready {
        if ($cod_trusted_origin_peer = 0) { return 404; }
        proxy_pass http://127.0.0.1:8787/ready;
    }

    location / {
        return 308 https://cod.kai.com$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name cod.kai.com;

    root /opt/cod/current/web;
    index index.html;

    # The public hostname terminates TLS at the ALB. Requests that reach this
    # origin from any other peer must not receive the application over HTTP.
    if ($cod_trusted_origin_peer = 0) { return 308 https://cod.kai.com$request_uri; }

    # Keep compression scoped to this virtual host. Ubuntu already enables
    # gzip in the parent http block, where declaring it again is a fatal
    # duplicate directive; a server-level override works in both cases.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        text/javascript
        text/css
        image/svg+xml;

    # The control plane also protects direct responses with nosniff. Hide that
    # upstream copy here so proxied responses expose one canonical header.
    proxy_hide_header X-Content-Type-Options;

    error_page 429 = @cod_rate_limited;

    location @cod_rate_limited {
        default_type application/json;
        charset utf-8;
        add_header Retry-After 1 always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-src https://hongkong.kai.com; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'" always;
        return 429 '{"error":"rate_limited","message":"Too many requests; retry shortly"}';
    }

    location = /api/auth/login {
        limit_req zone=cod_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Request-ID $cod_request_id;
    }

    location = /api/auth/register {
        limit_req zone=cod_auth burst=3 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Request-ID $cod_request_id;
    }

    # Heartbeats are intentionally isolated from the general API budget. A
    # stale tab or reconnect storm must not throttle account/task requests.
    location ~ "^/api/devices/[0-9A-Fa-f-]{36}/heartbeat$" {
        limit_req zone=cod_heartbeat_ip burst=100 nodelay;
        limit_req zone=cod_heartbeat_device burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $cod_request_id;
    }

    location /api/ {
        limit_req zone=cod_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $cod_request_id;
    }

    location /v1/ {
        limit_req zone=cod_ai burst=10 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 250s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $cod_request_id;
    }

    location = /control-health {
        proxy_pass http://127.0.0.1:8787/health;
    }

    location = /control-ready {
        proxy_pass http://127.0.0.1:8787/ready;
    }

    location ~ ^/(metrics|version)$ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8787;
    }

    location = /health { return 404; }
    location = /ready { return 404; }
    location = /_cod/expo-dom-bootstrap { return 404; }
    location ^~ /health/ { return 404; }
    location ^~ /ready/ { return 404; }
    location ^~ /_cod/expo-dom-bootstrap/ { return 404; }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        default_type application/manifest+json;
        try_files $uri =404;
        expires -1;
    }

    location = /index.html {
        try_files $uri =404;
        expires -1;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-src https://hongkong.kai.com; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-src https://hongkong.kai.com; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'" always;
}
